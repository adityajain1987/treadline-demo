<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Treadline — Price Book (Demo)</title>
<meta name="description" content="Per-dealer price lists for tyre distributors: one master list, per-customer discounts, pushed to every branch." />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#4f46e5" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Treadline" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Treadline" />
<meta property="og:title" content="Treadline — Price book" />
<meta property="og:description" content="Per-dealer price lists for tyre distributors: one master list, per-customer discounts, pushed to every branch." />
<meta property="og:image" content="https://adityajain1987.github.io/treadline-demo/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:url" content="https://adityajain1987.github.io/treadline-demo/treadline-pricebook-demo.html" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Treadline — Price book" />
<meta name="twitter:image" content="https://adityajain1987.github.io/treadline-demo/og.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0d0f14; --ink-2:#1f2430; --txt:#14171d; --muted:#666d79; --faint:#9aa0ab;
    --line:#ecedf1; --line-2:#f4f5f7; --bg:#f7f8fa; --card:#ffffff;
    --brand:#4f46e5; --brand-2:#6366f1; --brand-ink:#4338ca; --brand-bg:#eef0fe;
    --ok:#15a34a; --ok-bg:#e9f6ee; --warn:#b7791f; --warn-bg:#fbf3e0;
    --bad:#e0413f; --bad-bg:#fdecec; --info:#4f46e5; --info-bg:#eef0fe;
    --sh-sm:0 1px 1.5px rgba(16,18,24,.04);
    --sh:0 1px 2px rgba(16,18,24,.04),0 1px 3px rgba(16,18,24,.03);
    --sh-lg:0 18px 48px -16px rgba(16,18,24,.22);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;letter-spacing:-.005em}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---- app shell ---- */
  .app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .side{background:var(--card);border-inline-end:1px solid var(--line);color:var(--muted);display:flex;flex-direction:column;
    padding:20px 14px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 22px}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:var(--ink);
    display:grid;place-items:center;color:#fff}
  .brand .nm{font-weight:800;font-size:17px;color:var(--txt);letter-spacing:-.02em}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;color:var(--muted);
    text-decoration:none;font-weight:600;font-size:13.5px;cursor:pointer;transition:.12s}
  .nav a:hover{background:var(--bg);color:var(--txt)}
  .nav a.on{background:var(--brand-bg);color:var(--brand-ink)}
  .nav a.on svg{color:var(--brand)}
  .nav svg{width:18px;height:18px;color:var(--faint)}
  .side .grow{flex:1}
  .side .demo{display:flex;align-items:center;gap:8px;background:var(--warn-bg);border:1px solid #f3e3bf;
    color:var(--warn);border-radius:9px;padding:9px 11px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .side .who{margin-top:12px;padding:11px;border-radius:9px;background:var(--bg);border:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
  .side .who b{color:var(--txt);display:block;font-size:13px;font-weight:700}

  /* ---- main ---- */
  .main{min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line);
    background:rgba(255,255,255,.7);backdrop-filter:saturate(1.5) blur(6px);position:sticky;top:0;z-index:20}
  .top h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.02em}
  .top .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .top .grow{flex:1}
  .top .date{color:var(--muted);font-size:12.5px;font-weight:500}
  .top .topmark{display:none;width:32px;height:32px;border-radius:9px;background:var(--ink);place-items:center;flex:none}
  .top .toptitle{min-width:0}
  .toggle{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;box-shadow:var(--sh-sm)}
  .toggle button{border:0;background:#fff;padding:8px 13px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13px;font-family:inherit}
  .toggle button.on{background:var(--ink);color:#fff}
  .homelink{font-size:12.5px;color:var(--brand-ink);font-weight:700;text-decoration:none;border:1px solid #e2e4fb;background:#f4f5fe;border-radius:10px;padding:8px 12px;white-space:nowrap}
  .content{padding:24px 28px 60px;max-width:1280px;width:100%}

  /* ---- kpis ---- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
  .kpi .row1{display:flex;align-items:center;gap:8px;padding-inline-end:62px}
  .kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
  .kpi .ic svg{width:16px;height:16px}
  .kpi .label{color:var(--muted);font-size:12.5px;font-weight:600}
  .kpi .val{font-size:21px;font-weight:800;margin-top:11px;letter-spacing:-.03em;white-space:nowrap}
  .kpi .sub{font-size:12px;color:var(--faint);margin-top:3px;font-weight:500}
  .kpi .spark{position:absolute;inset-inline-end:14px;top:16px;opacity:.9}
  .ic.teal{background:var(--brand-bg,#e6f6f5);color:var(--brand-ink)}
  .ic.red{background:var(--bad-bg);color:var(--bad)} .ic.amber{background:var(--warn-bg);color:var(--warn)}
  .ic.blue{background:var(--info-bg);color:var(--info)}
  .kpi.bad .val{color:var(--bad)} .kpi.amber .val{color:var(--warn)}

  /* ---- grid ---- */
  .cols{display:grid;grid-template-columns:1.74fr 1fr;gap:16px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  .ch{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
  .ch h2{font-size:14px;margin:0;font-weight:700}
  .ch .count{margin-inline-start:auto;font-size:11px;color:var(--muted);font-weight:700;background:var(--line-2);padding:3px 9px;border-radius:999px}

  /* ---- table ---- */
  table{width:100%;border-collapse:collapse}
  th,td{text-align:start;padding:12px 15px;font-size:13.5px;border-bottom:1px solid var(--line-2);white-space:nowrap}
  th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fafbfd}
  td.num{font-weight:700}
  .who2{display:flex;align-items:center;gap:11px}
  .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex:none;letter-spacing:.02em}
  .who2 .nm{font-weight:700} .who2 .br{font-size:11.5px;color:var(--faint);margin-top:1px}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
  .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)}
  .bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px;width:82px}
  .bar>i{display:block;height:100%;border-radius:999px}
  .usage{font-size:12px;font-weight:700;color:var(--ink-2)}

  /* ---- exposure donut ---- */
  .expo{padding:18px 20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap}
  .donut-wrap{position:relative;flex:none}
  .donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .donut-c .p{font-size:21px;font-weight:800;letter-spacing:-.02em}
  .donut-c .l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .expo .meta{flex:none;min-width:180px;display:flex;flex-direction:column;gap:11px}
  .expo .mrow{display:flex;justify-content:space-between;align-items:center;gap:18px;font-size:13px}
  .expo .mrow .k{color:var(--muted);display:flex;align-items:center;gap:7px}
  .expo .mrow .k i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .expo .mrow b{font-weight:800;font-size:15px}
  .expo .brk{flex:1;min-width:260px;border-inline-start:1px solid var(--line-2);padding-inline-start:26px}
  .brk .bhead{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
  .brk .sbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line-2)}
  .brk .sbar>span{display:block;height:100%}
  .brk .blegend{display:flex;flex-direction:column;gap:9px;margin-top:14px}
  .brk .blrow{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
  .brk .blrow i{width:9px;height:9px;border-radius:3px;flex:none}
  .brk .blrow .amt{margin-inline-start:auto;font-weight:800;font-variant-numeric:tabular-nums}

  /* ---- alerts ---- */
  #alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;padding:16px}
  .alert{display:flex;gap:12px;padding:12px 13px;border:1px solid var(--line);border-radius:12px;align-items:center;background:#fff}
  .alert .ab{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
  .alert .ab svg{width:15px;height:15px}
  .alert .t{font-weight:700;font-size:13.5px} .alert .d{color:var(--muted);font-size:12px;margin-top:1px}
  .alert .amt{margin-inline-start:auto;font-weight:800;font-size:13px;text-align:end}

  /* ---- filters ---- */
  .filters{display:flex;gap:6px;padding:13px 18px 13px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);font-family:inherit;transition:.12s}
  .filters button:hover{border-color:#d7dee8}
  .filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---- drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(11,18,32,.5);opacity:0;pointer-events:none;transition:.22s;z-index:40}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;inset-inline-end:0;height:100%;width:430px;max-width:93vw;background:#fff;z-index:50;
    transform:translateX(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-lg);overflow-y:auto}
  [dir=rtl] .drawer{transform:translateX(-110%)}
  .drawer.show{transform:translateX(0)}
  .dh{padding:22px 22px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:13px}
  .dh .x{margin-inline-start:auto;border:0;background:var(--line-2);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink-2);font-family:inherit}
  .dh h3{margin:0 0 4px;font-size:18px;font-weight:800}
  .dh .m{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:9px}
  .dsec{padding:16px 22px;border-bottom:1px solid var(--line-2)}
  .dsec .lbl{font-size:11px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:11px}
  .age{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;text-align:center}
  .age .b{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 4px}
  .age .a-v{font-weight:800;font-size:15px} .age .a-l{font-size:10px;color:var(--muted);margin-top:3px}
  .age .hot{background:var(--bad-bg);border-color:#f6cccc} .age .hot .a-v{color:var(--bad)}
  .minirow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:center}
  .minirow:last-child{border-bottom:0}
  .foot{color:var(--faint);font-size:11.5px;text-align:center;margin-top:28px;line-height:1.7}

  /* ---- demo nav menu ---- */
  .menubtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--txt);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .menubtn:hover{background:var(--bg)}
  /* ---- guided hint ---- */
  .hintbar{display:flex;align-items:flex-start;gap:10px;background:#eef0fe;border:1px solid #dcdcfb;color:#3730a3;border-radius:12px;padding:11px 14px;font-size:13px;line-height:1.5}
  .hintbar .hi{flex:none;font-size:15px;line-height:1.45}
  .hintbar .htx{flex:1}
  .hintbar .hx{flex:none;border:0;background:transparent;color:#6366f1;cursor:pointer;font-size:15px;line-height:1;padding:0 2px;font-family:inherit;margin-inline-start:4px}
  .hintbar.hidden{display:none}
  .navsheet{position:fixed;inset:0;background:rgba(11,18,32,.5);opacity:0;pointer-events:none;transition:.2s;z-index:200}
  .navsheet.show{opacity:1;pointer-events:auto}
  .navpanel{position:fixed;top:0;inset-inline-end:0;height:100%;width:332px;max-width:88vw;background:#fff;transform:translateX(110%);transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:-18px 0 50px -16px rgba(16,18,24,.4);overflow-y:auto;z-index:201;display:flex;flex-direction:column}
  [dir=rtl] .navpanel{transform:translateX(-110%)}
  .navpanel.show{transform:none}
  .np-head{display:flex;align-items:center;gap:10px;padding:18px;border-bottom:1px solid var(--line)}
  .np-mark{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
  .np-nm{font-weight:800;font-size:17px;letter-spacing:-.02em}
  .np-x{margin-inline-start:auto;border:0;background:var(--line-2);border-radius:9px;width:32px;height:32px;cursor:pointer;font-size:15px;color:var(--ink-2);font-family:inherit}
  .np-list{padding:12px;display:flex;flex-direction:column;gap:4px}
  .np-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;text-decoration:none;color:var(--txt)}
  .np-item:hover{background:var(--bg)}
  .np-item.active{background:var(--brand-bg)}
  .np-ic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--ink-2)}
  .np-item.active .np-ic{background:#fff;color:var(--brand)}
  .np-ic svg{width:18px;height:18px}
  .np-tx{display:flex;flex-direction:column}
  .np-t{font-weight:700;font-size:14px}
  .np-item.active .np-t{color:var(--brand-ink)}
  .np-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .np-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
  @media(max-width:980px){.cols{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:720px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .top{position:sticky;top:0;z-index:30;background:var(--card);padding:11px 15px;gap:11px;flex-wrap:nowrap}
    .top .topmark{display:grid}
    .top h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top .sub{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .top .date{display:none}
    .content{padding:16px 14px 52px}
  }
  @media(max-width:640px){
    .kpis{gap:12px}
    .kpi{padding:14px}
    .kpi .spark{display:none}
    .kpi .row1{padding-inline-end:0}
    .kpi .val{font-size:17px;white-space:nowrap}
    .expo{flex-direction:column;align-items:stretch;gap:16px}
    .expo .donut-wrap{align-self:center}
    .expo .meta{min-width:0;width:100%}
    .expo .brk{flex:none;border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line-2);padding-top:16px;width:100%;min-width:0}
    .brk .blrow,.brk .blrow .amt{font-size:13px}
    table thead{display:none}
    table tbody tr{display:block;border:1px solid var(--line);border-radius:12px;margin:10px 14px;padding:2px 0;box-shadow:var(--sh-sm)}
    table tbody tr td{display:flex;align-items:center;justify-content:space-between;gap:14px;border:0;padding:9px 14px;white-space:normal;text-align:start}
    table tbody tr td::before{content:attr(data-label);color:var(--faint);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;flex:none}
    table tbody tr td:first-child{padding:12px 14px 6px}
    table tbody tr td:first-child::before{display:none}
    .bar{width:130px}
    .drawer{width:100%;max-width:100%}
  }
  /* ---- lifecycle: actions, modal, toast ---- */
  .acts{display:flex;gap:6px;justify-content:flex-end}
  .actbtn{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:30px;height:28px;display:inline-grid;place-items:center;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);font-family:inherit;padding:0 7px;transition:.12s}
  .actbtn svg{width:15px;height:15px}
  .actbtn:hover{border-color:#cfd8e3}
  .actbtn.ok:hover{background:var(--ok-bg);color:var(--ok);border-color:transparent}
  .actbtn.bad:hover{background:var(--bad-bg);color:var(--bad);border-color:transparent}
  .actbtn.info:hover{background:var(--info-bg);color:var(--info);border-color:transparent}
  .addbtn{margin-inline-start:auto;border:0;background:var(--ink);color:#fff;border-radius:9px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
  .addbtn svg{width:14px;height:14px}
  .blocked{display:flex;align-items:center;gap:10px;background:var(--bad-bg);color:#b91c1c;border:1px solid #f6cccc;border-radius:12px;padding:12px 14px;font-size:12.5px}
  .blocked svg{width:18px;height:18px;flex:none}
  .mscrim{position:fixed;inset:0;background:rgba(11,18,32,.5);opacity:0;pointer-events:none;transition:.2s;z-index:60;display:grid;place-items:center;padding:20px}
  .mscrim.show{opacity:1;pointer-events:auto}
  .modal{background:#fff;border-radius:18px;box-shadow:var(--sh-lg);width:430px;max-width:94vw;max-height:90vh;overflow:auto;transform:translateY(8px) scale(.98);transition:.2s}
  .mscrim.show .modal{transform:none}
  .mh{padding:18px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
  .mh h3{margin:0;font-size:16px;font-weight:800}
  .mh .x{margin-inline-start:auto;border:0;background:var(--line-2);border-radius:8px;width:30px;height:30px;cursor:pointer;font-family:inherit;color:var(--ink-2);font-size:14px}
  .mb{padding:18px 20px}
  .fld{margin-bottom:13px}
  .fld label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--txt)}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,165,164,.14)}

let lang="en", typeFilter="all", search="", viewDealer=1, version=14, pending=0;
const t=(k)=>TXT[lang][k]||k;
const fmt=(n)=>"OMR "+n.toLocaleString(lang==="ar"?"ar-OM":"en-US",{minimumFractionDigits:3,maximumFractionDigits:3});
const fmt0=(n)=>n.toLocaleString(lang==="ar"?"ar-OM":"en-US",{maximumFractionDigits:0});
const pname=(p)=>p.brand+" "+p.pat;
const tier=(id)=>tiers.find(x=>x.id===id);
const tierName=(id)=>tier(id)[lang];
const round3=(n)=>Math.round(n*1000)/1000;
const net=(list,disc)=>round3(list*(1-disc/100));
const pct=(n)=>"−"+fmt0(n)+"%";
const effDisc=(d)=>d.override!=null?d.override:tier(d.tier).disc;

function render(){
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  gid("enBtn").classList.toggle("on",lang==="en");
  gid("arBtn").classList.toggle("on",lang==="ar");
  document.querySelectorAll("[data-i18n]").forEach(n=>n.textContent=t(n.dataset.i18n));
  const bm=gid("brandMark");clear(bm);bm.appendChild(tyreSvg());
  const tm=gid("topMark");if(tm){clear(tm);tm.appendChild(tyreSvg());}
  gid("pageTitle").textContent=t("title");
  gid("pageSub").textContent=t("sub");
  gid("dateLbl").textContent=t("date");
  gid("homeLink").textContent=t("home");
  const ht=gid("hintText");if(ht){ht.textContent=t("hint");try{if(localStorage.getItem("tl_hint_"+(location.pathname.split("/").pop()||"x"))==="1")gid("hintbar").classList.add("hidden");}catch(e){}}
  const dt=gid("demoTag");clear(dt);dt.appendChild(icon("warn"));dt.firstChild.style.width="14px";dt.firstChild.style.height="14px";dt.appendChild(tn(t("demo")));
  const who=gid("whoBox");clear(who);who.appendChild(el("b",{text:t("whoT")}));who.appendChild(tn(t("whoS")));
  const nav=gid("nav");clear(nav);
  [["tag","nList","listCard",true],["percent","nDisc","discCard"],["dealers","nView","viewCard"],["map","nDist","distCard"]].forEach(([ic,key,target,on])=>{
    nav.appendChild(el("a",{class:on?"on":"",onclick:()=>gid(target).scrollIntoView({behavior:"smooth",block:"start"})},[icon(ic),el("span",{text:t(key)})]));
  });
  renderKpis();renderList();renderDiscounts();renderView();renderDistribute();
  const f=gid("foot");clear(f);f.appendChild(tn(t("footA")));f.appendChild(document.createElement("br"));f.appendChild(tn(t("footB")));
}

function renderKpis(){
  const kb=gid("kpis");clear(kb);
  const kpi=(ic,icc,label,val,sub)=>el("div",{class:"kpi"},[el("div",{class:"row1"},[el("div",{class:"ic "+icc},icon(ic)),el("div",{class:"label",text:label})]),el("div",{class:"val",text:val}),el("div",{class:"sub",text:sub})]);
  kb.appendChild(kpi("tag","teal",t("kItems"),fmt0(products.length),t("kItemsSub")));
  kb.appendChild(kpi("file","blue",t("kVersion"),"v"+fmt0(version),pending>0?t("kVersionPend").replace("{n}",fmt0(pending)):t("kVersionSub")));
  kb.appendChild(kpi("percent","amber",t("kTiers"),fmt0(3),t("kTiersSub").replace("{n}",fmt0(dealers.length))));
  kb.appendChild(kpi("map","green",t("kBranches"),fmt0(branches.length),pending>0?t("kBranchesPend").replace("{n}",fmt0(pending)):t("kBranchesSub")));
}

function priceEditor(p){
  const wrap=el("span",{class:"pedit"});
  function view(){clear(wrap);wrap.appendChild(el("button",{class:"pval",onclick:(e)=>{e.stopPropagation();edit();}},[el("span",{text:fmt(p.list)}),icon("edit")]));}
  function edit(){
    clear(wrap);
    const inp=el("input",{class:"pinput",type:"number",step:"0.5",min:"0",value:p.list.toFixed(3),onclick:(e)=>e.stopPropagation()});
    let done=false;
    const commit=()=>{if(done)return;done=true;const v=parseFloat(inp.value);if(!isNaN(v)&&v>0&&Math.abs(v-p.list)>1e-9){p.list=round3(v);pending++;render();toast(t("tPriceUpd"),"ok");}else{render();}};
    inp.addEventListener("keydown",(e)=>{e.stopPropagation();if(e.key==="Enter"){commit();}else if(e.key==="Escape"){done=true;render();}});
    inp.addEventListener("blur",commit);
    wrap.appendChild(inp);setTimeout(()=>{inp.focus();inp.select();},10);
  }
  view();return wrap;
}

function renderList(){
  gid("listCount").textContent=fmt0(products.length);
  const fb=gid("filters");clear(fb);
  fb.appendChild(el("input",{class:"search",type:"search",placeholder:t("searchPh"),value:search,oninput:(e)=>{search=e.target.value;renderList();}}));
  [["all","ty_all"],["car","ty_car"],["suv","ty_suv"],["perf","ty_perf"],["truck","ty_truck"]].forEach(([f,k])=>fb.appendChild(el("button",{class:f===typeFilter?"on":"",onclick:()=>{typeFilter=f;renderList();},text:t(k)})));
  const hh=gid("listHead");clear(hh);
  [t("tyre"),t("type"),t("listRetail")].forEach(x=>hh.appendChild(el("th",{text:x})));
  ["bronze","silver","gold"].forEach(id=>hh.appendChild(el("th",{class:"r",text:tierName(id)+" "+pct(tier(id).disc)})));
  const q=search.trim().toLowerCase();
  const rows=products.filter(p=>(typeFilter==="all"||p.type===typeFilter)&&(!q||(p.size+" "+p.brand+" "+p.pat).toLowerCase().includes(q)));
  const tb=document.querySelector("#listTable tbody");clear(tb);
  if(!rows.length){tb.appendChild(el("tr",{},[el("td",{colspan:"6",style:"text-align:center;color:var(--muted);padding:26px",text:t("noMatch")})]));return;}
  rows.forEach(p=>{
    tb.appendChild(el("tr",{onclick:()=>openDetail(p.id)},[
      el("td",{},[el("div",{class:"tyid"},[el("div",{class:"nm",text:pname(p)}),el("div",{class:"br",text:p.size+" · "+p.idx})])]),
      el("td",{"data-label":t("type"),text:t("ty_"+p.type)}),
      el("td",{"data-label":t("listRetail"),class:"pcell"},[priceEditor(p)]),
      el("td",{"data-label":tierName("bronze"),class:"num r",text:fmt(net(p.list,tier("bronze").disc))}),
      el("td",{"data-label":tierName("silver"),class:"num r",text:fmt(net(p.list,tier("silver").disc))}),
      el("td",{"data-label":tierName("gold"),class:"num r",text:fmt(net(p.list,tier("gold").disc))})
    ]));
  });
}

function renderDiscounts(){
  const tbx=gid("tierBox");clear(tbx);
  tiers.filter(x=>x.id!=="retail").forEach(tr=>{
    const cnt=dealers.filter(d=>d.override==null&&d.tier===tr.id).length;
    const inp=el("input",{class:"discinput",type:"number",min:"0",max:"90",step:"1",value:String(tr.disc),onclick:(e)=>e.stopPropagation()});
    let done=false;
    const commit=()=>{if(done)return;done=true;const v=parseInt(inp.value,10);if(!isNaN(v)&&v>=0&&v<=90&&v!==tr.disc){tr.disc=v;pending++;render();toast(t("tDiscUpd"),"ok");}else render();};
    inp.addEventListener("keydown",(e)=>{e.stopPropagation();if(e.key==="Enter")commit();});
    inp.addEventListener("blur",commit);
    tbx.appendChild(el("div",{class:"trow"},[
      el("span",{class:"tpill tp-"+tr.id,text:tr[lang]}),
      el("span",{class:"tsub",text:t("dealersOn").replace("{n}",fmt0(cnt))}),
      el("span",{class:"tdisc"},[inp,el("span",{class:"pctlbl",text:"% "+t("off")})])
    ]));
  });
  gid("dealerCount").textContent=fmt0(dealers.length);
  const hh=gid("dealerHead");clear(hh);[t("dealer"),t("tierLbl"),t("special"),t("effective")].forEach(x=>hh.appendChild(el("th",{text:x})));
  const tb=document.querySelector("#dealerTable tbody");clear(tb);
  dealers.forEach(d=>{
    const sel=el("select",{class:"dsel",onchange:(e)=>{d.tier=e.target.value;pending++;render();toast(t("tTierUpd"),"ok");}},tiers.map(tr=>el("option",{value:tr.id,text:tr[lang]})));
    sel.value=d.tier;
    const ov=el("input",{class:"discinput",type:"number",min:"0",max:"90",placeholder:"—",value:d.override!=null?String(d.override):""});
    let done=false;
    const commit=()=>{if(done)return;done=true;const raw=ov.value.trim();let v=raw===""?null:parseInt(raw,10);if(v!=null&&(isNaN(v)))v=null;if(v!=null)v=Math.max(0,Math.min(90,v));if(v!==d.override){d.override=v;pending++;render();toast(t("tTierUpd"),"ok");}else render();};
    ov.addEventListener("keydown",(e)=>{e.stopPropagation();if(e.key==="Enter")commit();});
    ov.addEventListener("blur",commit);
    tb.appendChild(el("tr",{},[
      el("td",{},[el("div",{class:"who2"},[el("div",{class:"av",style:"width:30px;height:30px;border-radius:9px;font-size:11px;background:"+avColors[(d.id-1)%avColors.length],text:initials(d)}),el("span",{class:"nm",text:d[lang]})])]),
      el("td",{"data-label":t("tierLbl")},[sel]),
      el("td",{"data-label":t("special")},[ov]),
      el("td",{"data-label":t("effective"),class:"num r"},[el("b",{text:pct(effDisc(d))}),d.override!=null?el("span",{class:"tagsp",text:" "+t("custom")}):null])
    ]));
  });
}

function renderView(){
  const sel=gid("dvSelect");clear(sel);
  dealers.forEach(d=>sel.appendChild(el("option",{value:String(d.id),text:d[lang]})));
  sel.value=String(viewDealer);
  const d=dealers.find(x=>x.id===viewDealer)||dealers[0];
  gid("dvNote").textContent=t("dvNote").replace("{tier}",tier(d.tier)[lang]).replace("{disc}",pct(effDisc(d)));
  const hh=gid("viewHead");clear(hh);
  hh.appendChild(el("th",{text:t("tyre")}));
  hh.appendChild(el("th",{class:"r",text:t("listRetail")}));
  hh.appendChild(el("th",{class:"r",text:t("dvPays").replace("{d}",d[lang])}));
  const tb=document.querySelector("#viewTable tbody");clear(tb);
  products.forEach(p=>{
    tb.appendChild(el("tr",{},[
      el("td",{},[el("div",{class:"tyid"},[el("div",{class:"nm",text:pname(p)}),el("div",{class:"br",text:p.size+" · "+p.idx})])]),
      el("td",{"data-label":t("listRetail"),class:"num r"},[el("span",{class:"strk",text:fmt(p.list)})]),
      el("td",{"data-label":t("dvPaysShort"),class:"num r net",text:fmt(net(p.list,effDisc(d)))})
    ]));
  });
}

function renderDistribute(){
  const dirty=pending>0;
  const st=gid("distStat");clear(st);
  st.appendChild(el("span",{class:"chip "+(dirty?"c-warn":"c-ok")},[tn(dirty?t("changesPending").replace("{n}",fmt0(pending)):t("allSync"))]));
  st.appendChild(el("span",{style:"color:var(--muted)",text:t("liveVersion").replace("{v}","v"+fmt0(version))}));
  const bb=gid("branchBar");clear(bb);
  branches.forEach(b=>bb.appendChild(el("span",{class:"bchip "+(dirty?"pend":"ok")},[icon("map"),tn(b[lang])])));
  const db=gid("distBtns");clear(db);
  const btn=(ic,cls,label,sub,fn)=>el("button",{class:"dbtn "+cls,onclick:fn},[icon(ic),el("span",{},[tn(label),el("span",{class:"db-s",text:sub})])]);
  db.appendChild(btn("send","primary",t("publish"),t("publishSub").replace("{n}",fmt0(branches.length)),doPublish));
  db.appendChild(btn("download","",t("exportPdf"),t("exportPdfSub"),()=>toast(t("tPdf"),"ok")));
  db.appendChild(btn("wa","",t("waNotice"),t("waNoticeSub"),openWaNotice));
  db.appendChild(btn("file","",t("importXls"),t("importXlsSub"),openImport));
}

function doPublish(){if(pending===0){toast(t("tNoChange"),"ok");return;}version++;pending=0;render();toast(t("tPublished").replace("{v}","v"+fmt0(version)).replace("{n}",fmt0(branches.length)),"ok");}

function openDetail(id){
  const p=products.find(x=>x.id===id);
  const dr=gid("drawer");clear(dr);
  dr.appendChild(el("div",{class:"dh"},[
    el("div",{class:"av",style:"width:46px;height:46px;border-radius:13px;font-size:14px;background:"+avColors[products.indexOf(p)%avColors.length],text:p.size.split("/")[0].slice(0,3)}),
    el("div",{},[el("h3",{text:p.size}),el("div",{class:"m",text:pname(p)+" · "+p.idx})]),
    el("button",{class:"x",text:"✕",onclick:closeDrawer})
  ]));
  dr.appendChild(el("div",{class:"dsec"},[el("div",{class:"lbl",text:t("listRetail")}),el("div",{style:"font-size:22px;font-weight:800",text:fmt(p.list)})]));
  const byTier=el("div",{class:"dsec"},[el("div",{class:"lbl",text:t("byTier")})]);
  tiers.filter(x=>x.id!=="retail").forEach(tr=>byTier.appendChild(el("div",{class:"minirow"},[el("span",{style:"display:flex;align-items:center;gap:8px"},[el("span",{class:"tpill tp-"+tr.id,style:"padding:3px 9px;font-size:11px",text:tr[lang]}),el("span",{style:"color:var(--muted)",text:pct(tr.disc)})]),el("b",{class:"num",text:fmt(net(p.list,tr.disc))})])));
  dr.appendChild(byTier);
  const byD=el("div",{class:"dsec"},[el("div",{class:"lbl",text:t("byDealer")})]);
  dealers.forEach(d=>byD.appendChild(el("div",{class:"minirow"},[el("span",{style:"color:var(--muted)",text:d[lang]+(d.override!=null?" · "+t("custom"):"")}),el("b",{class:"num",text:fmt(net(p.list,effDisc(d)))})])));
  dr.appendChild(byD);
  dr.appendChild(el("div",{class:"dsec",style:"color:var(--muted);font-size:12.5px",text:t("detailNote")}));
  dr.classList.add("show");gid("scrim").classList.add("show");
}
function closeDrawer(){gid("drawer").classList.remove("show");gid("scrim").classList.remove("show");}

function toast(msg,kind){const node=gid("toast");clear(node);node.appendChild(icon(kind==="bad"?"warn":"check"));node.appendChild(tn(msg));node.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>node.classList.remove("show"),2800);}

function openWaNotice(){
  openModal(el("div",{},[
    el("div",{class:"mh"},[el("h3",{text:t("waNotice")}),el("button",{class:"x",text:"✕",onclick:closeModal})]),
    el("div",{class:"mb"},[
      el("div",{class:"wa"},[el("div",{class:"wabar"},[icon("wa"),el("span",{text:t("whoT")})]),el("div",{class:"wabubble"},[tn(t("waMsg")),el("div",{class:"watime",text:"09:24"})])]),
      el("div",{class:"mactions",style:"margin-top:15px"},[el("button",{class:"btn ghost",text:t("cancel"),onclick:closeModal}),el("button",{class:"btn primary",text:t("waSend"),onclick:()=>{closeModal();toast(t("tWaSent"),"ok");}})])
    ])
  ]));
}
function openImport(){
  openModal(el("div",{},[
    el("div",{class:"mh"},[el("h3",{text:t("importXls")}),el("button",{class:"x",text:"✕",onclick:closeModal})]),
    el("div",{class:"mb"},[
      el("button",{class:"photo",onclick:()=>{}},[icon("file"),el("span",{text:"price-list-2026.xlsx · "+t("importedFile").replace("{n}",fmt0(products.length))})]),
      el("div",{style:"background:var(--warn-bg);border:1px solid #f3e3bf;color:var(--warn);border-radius:11px;padding:11px 13px;font-size:12.5px;margin-bottom:14px",text:t("importNote")}),
      el("div",{class:"mactions"},[el("button",{class:"btn ghost",text:t("cancel"),onclick:closeModal}),el("button",{class:"btn primary",text:t("importBtn"),onclick:()=>{closeModal();toast(t("tImported").replace("{n}",fmt0(products.length)),"ok");}})])
    ])

render();
